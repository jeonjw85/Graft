name: e2e

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pairing:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: android

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: macos/.build
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('macos/Package.swift') }}

      - name: Ensure the login keychain is unlocked
        run: |
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db || true

      - name: Run transport and pairing end-to-end test
        run: ./protocol/tools/e2e-pairing.sh
