version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx:kotlinx-serialization-*"
    open-pull-requests-limit: 3

  - package-ecosystem: swift
    directory: /macos
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    open-pull-requests-limit: 2
