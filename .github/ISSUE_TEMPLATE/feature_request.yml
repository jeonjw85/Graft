name: 기능 제안
description: 새 기능이나 개선 아이디어를 제안해 주세요.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 어떤 상황에서 불편한지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안 (선택)
  - type: dropdown
    id: scope
    attributes:
      label: 해당 플랫폼
      options:
        - macOS
        - Android
        - 둘 다
    validations:
      required: true
