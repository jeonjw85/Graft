name: Bug report
description: Tell us when Graft does something unexpected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do not open a public issue. Follow the process in [SECURITY.md](../blob/main/SECURITY.md) instead.
        Before pasting logs, remove device names, IP addresses, and clipboard or notification contents.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Android
        - Both
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App and OS versions
      placeholder: "e.g. Graft 0.1.0, macOS 15.2 / Android 14"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      render: shell
