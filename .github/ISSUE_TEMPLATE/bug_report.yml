name: 버그 신고
description: 예상과 다르게 동작할 때 알려 주세요.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        보안 취약점은 공개 이슈 대신 [SECURITY.md](../blob/main/SECURITY.md)의 절차를 따라 주세요.
        로그를 붙일 때 기기 이름, IP 주소, 클립보드/알림 내용은 지워 주세요.
  - type: dropdown
    id: platform
    attributes:
      label: 플랫폼
      options:
        - macOS
        - Android
        - 둘 다
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 앱과 OS 버전
      placeholder: "예: Graft 0.1.0, macOS 15.2 / Android 14"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그 (선택)
      render: shell
